name: AI Advisor

on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: ai-advisor
  cancel-in-progress: false

jobs:
  advise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run advisor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/ai_advisor.py
      - name: Commit advice
        run: |
          if [ ! -f output/ai_advice.json ]; then
            echo "ai_advice.json не создан, смотрите лог шага Run advisor"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ai_advice.json
          git diff --cached --quiet || (git commit -m "AI advice" && git pull --rebase && git push)
