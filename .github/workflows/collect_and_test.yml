name: Collect and Test VPN Sources

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: write

concurrency:
  group: koteito-vpn-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install sing-box
        run: |
          TAG=$(git ls-remote --tags --refs https://github.com/SagerNet/sing-box 'refs/tags/v1.12.*' | sed 's#.*refs/tags/##' | grep -E '^v1\.12\.[0-9]+$' | sort -V | tail -1)
          echo "sing-box $TAG"
          mkdir -p /tmp/sb
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/${TAG}/sing-box-${TAG#v}-linux-amd64.tar.gz" | tar -xz -C /tmp/sb --strip-components=1
          sudo install -m 755 /tmp/sb/sing-box /usr/local/bin/sing-box
          sing-box version

      - name: Restore server history
        uses: actions/cache/restore@v4
        with:
          path: server_history.json
          key: server-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            server-history-

      - name: Run collector -> filter -> ping -> dns
        run: |
          python scripts/collect_telegram.py
          python scripts/collect_sources.py
          python scripts/filter_clean.py
          python scripts/ping_test.py
          python scripts/dns_test.py
          python scripts/build_raw_list.py

      - name: Save server history
        if: success()
        uses: actions/cache/save@v4
        with:
          path: server_history.json
          key: server-history-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit updated raw list
        run: |
          git config user.name "koteito-bot"
          git config user.email "bot@users.noreply.github.com"
          git add output/raw_servers.txt
          git add output/telegram_configs.txt 2>/dev/null || true
          git diff --cached --quiet && echo "Нет изменений" || git commit -m "auto: обновление raw_servers.txt"
          git fetch origin main
          git merge -X ours --no-edit origin/main
          git push

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN не задан — пропускаем уведомление."
            exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="❌ KoteitoVPN: collect_and_test упал. Смотри лог: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
