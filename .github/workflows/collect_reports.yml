name: Collect User Reports

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      update:
        description: "JSON сообщения Telegram (подставляет Worker, вручную оставить пустым)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ALLOWED_REPORTER_IDS: ${{ secrets.ALLOWED_REPORTER_IDS }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      REPORT_UPDATE: ${{ github.event.inputs.update }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect reports
        run: python scripts/collect_reports.py

      - name: Commit updated report files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add output/server_reports.json output/telegram_offset.json
            if git diff --staged --quiet; then
              echo "Нет изменений"
              exit 0
            fi
            git commit -m "Update user reports [skip ci]"
            if git push; then
              exit 0
            fi
            echo "push не прошёл (попытка $attempt), повторяю на свежей main"
            git fetch origin main
            git reset --hard origin/main
            COLLECT_NO_REPLY=1 python scripts/collect_reports.py
          done
          echo "Не удалось отправить изменения после 5 попыток"
          exit 1
