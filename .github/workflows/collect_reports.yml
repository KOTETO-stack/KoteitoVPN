name: Collect User Reports

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect reports from Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_REPORTER_IDS: ${{ secrets.ALLOWED_REPORTER_IDS }}
        run: python scripts/collect_reports.py

      - name: Commit updated report files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/server_reports.json output/telegram_offset.json
          git diff --staged --quiet && echo "Нет изменений" || git commit -m "Update user reports [skip ci]"
          git fetch origin main
          git merge -X ours --no-edit origin/main
          git push
