name: Expand Sources

on:
  schedule:
    - cron: "30 3 * * *"   # раз в сутки
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Try to promote candidate sources
        run: python scripts/promote_candidates.py

      - name: Commit if sources.txt changed
        run: |
          git config user.name "koteito-bot"
          git config user.email "bot@users.noreply.github.com"
          git add sources.txt candidate_sources.txt
          git diff --cached --quiet && echo "Нет новых источников" || git commit -m "auto: продвижение новых источников из candidate_sources.txt"
          git pull --rebase --autostash
          git push

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN не задан — пропускаем уведомление."
            exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="❌ KoteitoVPN: expand_sources упал. Смотри лог: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
