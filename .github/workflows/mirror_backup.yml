name: Mirror Backup

on:
  workflow_run:
    workflows: ["Build Final Subscription"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  mirror:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mirror output/ to backup repo (optional)
        env:
          MIRROR_REPO: ${{ secrets.MIRROR_REPO }}
          MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
        run: |
          if [ -z "$MIRROR_REPO" ] || [ -z "$MIRROR_PAT" ]; then
            echo "MIRROR_REPO / MIRROR_PAT не заданы — резервное зеркало не настроено, пропускаем."
            exit 0
          fi
          git config --global user.name "koteito-mirror-bot"
          git config --global user.email "bot@users.noreply.github.com"
          rm -rf /tmp/mirror
          git clone "https://x-access-token:${MIRROR_PAT}@github.com/${MIRROR_REPO}.git" /tmp/mirror
          mkdir -p /tmp/mirror/output
          cp -f output/subscription.txt output/subscription_readable.txt output/ad_block_rules.txt /tmp/mirror/output/ 2>/dev/null || true
          cd /tmp/mirror
          git add output/
          git diff --cached --quiet && echo "Нет изменений в зеркале" || git commit -m "auto: зеркало subscription.txt"
          git push
