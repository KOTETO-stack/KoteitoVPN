name: Run All (collect -> RU probe -> advisor -> build)

# Один запуск вручную: сбор и проверка серверов, проверка из РФ,
# ИИ-советчик, затем сборка подписок.
# Проверка из РФ и советчик не блокируют сборку: если они упадут,
# сборка всё равно запустится. Если упадёт сбор, дальше ничего не идёт.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  models: read

jobs:
  collect:
    uses: ./.github/workflows/collect_and_test.yml
    secrets: inherit

  probe:
    needs: collect
    if: ${{ !cancelled() && needs.collect.result == 'success' }}
    uses: ./.github/workflows/ru_probe.yml
    secrets: inherit

  advise:
    needs: [collect, probe]
    if: ${{ !cancelled() && needs.collect.result == 'success' }}
    uses: ./.github/workflows/ai_advisor.yml
    secrets: inherit

  build:
    needs: [collect, probe, advise]
    if: ${{ !cancelled() && needs.collect.result == 'success' }}
    uses: ./.github/workflows/build_subscription.yml
    secrets: inherit
