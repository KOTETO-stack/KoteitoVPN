name: Run All (collect -> advisor -> build)

# Один запуск вручную: сбор и проверка серверов, затем ИИ-советчик,
# затем сборка подписок. Если советчик упадёт, сборка всё равно запустится.
# Если упадёт сбор, дальше ничего не запускается.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  models: read

jobs:
  collect:
    uses: ./.github/workflows/collect_and_test.yml
    secrets: inherit

  advise:
    needs: collect
    uses: ./.github/workflows/ai_advisor.yml
    secrets: inherit

  build:
    needs: [collect, advise]
    if: ${{ !cancelled() && needs.collect.result == 'success' }}
    uses: ./.github/workflows/build_subscription.yml
    secrets: inherit
