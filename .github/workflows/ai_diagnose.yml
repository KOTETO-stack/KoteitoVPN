name: AI Diagnose

on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Диагностика GitHub Models
        env:
          MODELS_TOKEN: ${{ secrets.MODELS_TOKEN }}
        run: |
          probe() {
            echo
            echo "=================== $1"
            shift
            rm -f /tmp/h.txt /tmp/b.txt
            curl -sS --max-time 30 -D /tmp/h.txt -o /tmp/b.txt \
              -w "итог: код=%{http_code} ip=%{remote_ip} тип=%{content_type} размер=%{size_download}\n" \
              "$@" || echo "curl: ошибка $?"
            echo "--- заголовки ответа"
            cat /tmp/h.txt 2>/dev/null || echo "(нет)"
            echo "--- тело (начало)"
            head -c 500 /tmp/b.txt 2>/dev/null
            echo
          }

          echo "--- DNS"
          getent hosts models.github.ai || echo "models.github.ai: не найден"
          getent hosts models.inference.ai.azure.com || echo "models.inference.ai.azure.com: не найден"
          echo "--- прокси (только имена переменных)"
          env | grep -i '^\(http\|https\|no\|all\)_proxy=' | sed 's/=.*/ задана/' || echo "прокси не заданы"

          probe "1. Токен жив? api.github.com/rate_limit" \
            https://api.github.com/rate_limit \
            -H "Authorization: Bearer ${MODELS_TOKEN}" \
            -H "Accept: application/vnd.github+json"

          probe "2. Каталог моделей, с токеном" \
            https://models.github.ai/catalog/models \
            -H "Authorization: Bearer ${MODELS_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28"

          probe "3. Каталог моделей, без токена" \
            https://models.github.ai/catalog/models \
            -H "Accept: application/vnd.github+json"

          probe "4. Запрос к модели, адрес models.github.ai" \
            https://models.github.ai/inference/chat/completions \
            -X POST \
            -H "Authorization: Bearer ${MODELS_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"Reply with the word OK"}],"max_tokens":5}'

          probe "5. Запрос к модели, старый адрес models.inference.ai.azure.com" \
            https://models.inference.ai.azure.com/chat/completions \
            -X POST \
            -H "Authorization: Bearer ${MODELS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"Reply with the word OK"}],"max_tokens":5}'
