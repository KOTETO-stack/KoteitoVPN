name: RU Probe

on:
  schedule:
    - cron: "25 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ru-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run probe
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALWAYS_REPORT: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scripts/ru_probe.py
      - name: Commit results
        run: |
          if [ ! -f output/ru_probe.json ]; then
            echo "output/ru_probe.json не создан"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ru_probe.json
          git diff --cached --quiet || (git commit -m "RU probe" && git pull --rebase && git push)
